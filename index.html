<html lang="fa" dir="rtl">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<meta name="theme-color" content="#020711">

<title>Amirali Asghari</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:#01040a;
    color:white;
    font-family:Arial,sans-serif;
    overflow-x:hidden;
}

/* ================= BACKGROUND ================= */

#universe{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:0;

    background:
        radial-gradient(circle at 50% 10%,rgba(0,150,255,.23),transparent 30%),
        radial-gradient(circle at 0% 80%,rgba(0,70,255,.18),transparent 30%),
        radial-gradient(circle at 100% 70%,rgba(0,220,255,.12),transparent 30%),
        #01040a;
}

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    pointer-events:none;
}

.orb1{
    width:320px;
    height:320px;
    background:#006cff;
    top:-120px;
    left:-100px;
    animation:orb1 12s infinite alternate ease-in-out;
}

.orb2{
    width:280px;
    height:280px;
    background:#00c8ff;
    right:-120px;
    top:35%;
    animation:orb2 15s infinite alternate ease-in-out;
}

.orb3{
    width:350px;
    height:350px;
    background:#002eff;
    bottom:-220px;
    left:20%;
    animation:orb3 18s infinite alternate ease-in-out;
}

@keyframes orb1{
    to{
        transform:translate(180px,230px) scale(1.35);
    }
}

@keyframes orb2{
    to{
        transform:translate(-170px,120px) scale(1.4);
    }
}

@keyframes orb3{
    to{
        transform:translate(100px,-150px) scale(1.4);
    }
}

/* ================= GRID ================= */

.grid{
    position:absolute;
    inset:-20%;
    opacity:.12;

    background-image:
        linear-gradient(rgba(0,170,255,.4) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,170,255,.4) 1px,transparent 1px);

    background-size:45px 45px;

    transform:
        perspective(450px)
        rotateX(60deg)
        scale(1.4);

    transform-origin:center bottom;

    animation:gridMove 10s linear infinite;
}

@keyframes gridMove{
    to{
        background-position:0 45px,45px 0;
    }
}

/* ================= STARS ================= */

#stars{
    position:absolute;
    inset:0;
}

.star{
    position:absolute;
    width:2px;
    height:2px;
    border-radius:50%;
    background:white;

    box-shadow:
        0 0 7px #00bfff,
        0 0 16px #008cff;

    animation:starFall linear infinite;
}

@keyframes starFall{

    from{
        transform:translateY(110vh) scale(.2);
        opacity:0;
    }

    10%{
        opacity:1;
    }

    50%{
        transform:translateY(50vh) scale(1.5);
    }

    to{
        transform:translateY(-10vh) scale(.2);
        opacity:0;
    }
}

/* ================= METEORS ================= */

.meteor{
    position:absolute;
    width:120px;
    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #00c8ff,
            white
        );

    box-shadow:
        0 0 10px #00bfff,
        0 0 25px #008cff;

    transform:rotate(-35deg);

    opacity:0;

    animation:meteor 8s linear infinite;
}

.meteor1{
    top:10%;
    left:80%;
    animation-delay:2s;
}

.meteor2{
    top:35%;
    left:30%;
    animation-delay:6s;
}

.meteor3{
    top:60%;
    left:90%;
    animation-delay:10s;
}

@keyframes meteor{

    0%,75%{
        opacity:0;
        transform:
            translate(0,0)
            rotate(-35deg);
    }

    78%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:
            translate(-500px,500px)
            rotate(-35deg);
    }
}

/* ================= SCANLINES ================= */

.scanlines{
    position:fixed;
    inset:0;

    z-index:3;

    pointer-events:none;

    opacity:.07;

    background:
        repeating-linear-gradient(
            0deg,
            transparent 0px,
            transparent 3px,
            rgba(0,180,255,.25) 4px
        );
}

/* ================= MAIN ================= */

.container{
    width:100%;
    max-width:480px;

    margin:auto;

    padding:42px 14px 45px;

    position:relative;

    z-index:10;

    text-align:center;

    transition:transform .2s ease;
}

/* ================= HUD ================= */

.top-hud{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:25px;

    font-size:9px;

    color:#5e91ad;

    letter-spacing:2px;
}

.hud-left,
.hud-right{
    display:flex;
    align-items:center;

    gap:7px;
}

.online-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#00ff9d;

    box-shadow:
        0 0 8px #00ff9d,
        0 0 18px #00ff9d;

    animation:pulse 1.5s infinite;
}

@keyframes pulse{

    50%{
        opacity:.35;
        transform:scale(.7);
    }
}

/* ================= PROFILE ================= */

.profile-zone{
    width:180px;
    height:180px;

    margin:0 auto 25px;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;
}

.profile-zone::before{
    content:"";

    position:absolute;

    inset:-12px;

    border-radius:50%;

    border:
        1px solid rgba(0,200,255,.65);

    box-shadow:
        0 0 20px rgba(0,170,255,.5);

    animation:spin 8s linear infinite;
}

.profile-zone::after{
    content:"";

    position:absolute;

    inset:-25px;

    border-radius:50%;

    border:
        1px dashed rgba(0,150,255,.28);

    animation:
        spinReverse
        15s
        linear
        infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}

@keyframes spinReverse{

    to{
        transform:rotate(-360deg);
    }
}

.profile{
    width:155px;
    height:155px;

    padding:5px;

    border-radius:50%;

    background:
        linear-gradient(
            135deg,
            #00ffff,
            #0077ff,
            #0055ff,
            #00c8ff
        );

    background-size:400% 400%;

    animation:
        gradient
        4s
        ease
        infinite;

    box-shadow:
        0 0 20px #008cff,
        0 0 60px rgba(0,140,255,.6),
        0 0 110px rgba(0,140,255,.25);

    position:relative;

    z-index:2;
}

@keyframes gradient{

    0%{
        background-position:0% 50%;
    }

    50%{
        background-position:100% 50%;
    }

    100%{
        background-position:0% 50%;
    }
}

.profile img{
    width:100%;
    height:100%;

    object-fit:cover;

    border-radius:50%;

    border:4px solid #01040a;
}

/* ================= NAME ================= */

h1{
    font-size:34px;

    margin-bottom:8px;

    letter-spacing:1px;

    text-shadow:
        0 0 20px rgba(255,255,255,.15);
}

h1 span{
    color:#00c8ff;

    text-shadow:
        0 0 10px #00c8ff,
        0 0 30px #008cff,
        0 0 60px rgba(0,140,255,.6);
}

.subtitle{
    color:#7f9aac;

    letter-spacing:5px;

    font-size:12px;

    margin-bottom:18px;
}

.line{
    width:100px;
    height:2px;

    margin:0 auto 28px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #00c8ff,
            transparent
        );

    box-shadow:
        0 0 15px #008cff;

    animation:
        linePulse
        2s
        infinite
        alternate;
}

@keyframes linePulse{

    to{
        width:170px;

        box-shadow:
            0 0 30px #00bfff;
    }
}

/* ================= BUTTONS ================= */

.buttons{
    display:flex;
    flex-direction:column;

    gap:14px;
}

.btn{
    width:100%;

    min-height:76px;

    display:flex;
    align-items:center;

    position:relative;

    overflow:hidden;

    padding:11px 17px;

    border-radius:21px;

    color:white;

    text-decoration:none;

    background:
        linear-gradient(
            120deg,
            rgba(0,105,190,.32),
            rgba(2,12,25,.72)
        );

    border:
        1px solid rgba(0,180,255,.5);

    backdrop-filter:blur(18px);

    box-shadow:
        0 0 15px rgba(0,140,255,.13),
        inset 0 0 25px rgba(0,140,255,.05);

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        border .25s ease;

    animation:
        buttonIn
        .7s
        ease
        both;
}

.btn:nth-child(1){
    animation-delay:.1s;
}

.btn:nth-child(2){
    animation-delay:.2s;
}

.btn:nth-child(3){
    animation-delay:.3s;
}

.btn:nth-child(4){
    animation-delay:.4s;
}

.btn:nth-child(5){
    animation-delay:.5s;
}

@keyframes buttonIn{

    from{
        opacity:0;
        transform:
            translateY(30px)
            scale(.94);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}

.btn::before{
    content:"";

    position:absolute;

    width:100px;
    height:250%;

    left:-150px;
    top:-70%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.22),
            transparent
        );

    transform:rotate(20deg);

    transition:.8s;
}

.btn:hover::before{
    left:130%;
}

.btn:hover{
    transform:
        translateY(-5px)
        scale(1.015);

    border-color:#00d9ff;

    box-shadow:
        0 0 25px rgba(0,190,255,.5),
        0 0 60px rgba(0,140,255,.2),
        inset 0 0 30px rgba(0,180,255,.1);
}

/* ================= ICONS ================= */

.icon{
    width:50px;
    height:50px;

    flex-shrink:0;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    margin-left:14px;

    font-size:21px;

    transition:.3s;
}

.btn:hover .icon{
    transform:
        scale(1.14)
        rotate(-7deg);
}

.phone{
    background:
        linear-gradient(
            135deg,
            #00d9ff,
            #006eff
        );

    box-shadow:
        0 0 18px rgba(0,180,255,.5);
}

.instagram{
    background:
        linear-gradient(
            135deg,
            #833ab4,
            #fd1d1d,
            #fcb045
        );

    box-shadow:
        0 0 18px rgba(253,29,29,.3);
}

.telegram{
    background:
        linear-gradient(
            135deg,
            #2AABEE,
            #229ED9
        );

    box-shadow:
        0 0 18px rgba(42,171,238,.5);
}

.whatsapp{
    background:
        linear-gradient(
            135deg,
            #25D366,
            #128C7E
        );

    box-shadow:
        0 0 18px rgba(37,211,102,.4);
}

.email{
    background:
        linear-gradient(
            135deg,
            #00d9ff,
            #006eff
        );

    box-shadow:
        0 0 18px rgba(0,180,255,.5);
}

/* ================= TEXT ================= */

.text{
    flex:1;

    text-align:right;
}

.text strong{
    display:block;

    font-size:17px;

    margin-bottom:5px;
}

.text small{
    display:block;

    direction:ltr;

    color:#91aabd;

    font-size:11px;
}

.arrow{
    color:#72ddff;

    font-size:30px;

    margin-right:7px;

    transition:.3s;
}

.btn:hover .arrow{
    transform:translateX(-6px);

    color:white;

    text-shadow:
        0 0 15px #00c8ff;
}

/* ================= QUICK ACTIONS ================= */

.quick{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:9px;

    margin-top:15px;
}

.quick-btn{
    border:
        1px solid rgba(0,170,255,.35);

    background:
        rgba(2,18,32,.65);

    color:#9ddfff;

    border-radius:15px;

    min-height:52px;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:6px;

    font-size:10px;

    cursor:pointer;

    backdrop-filter:blur(12px);

    transition:.25s;
}

.quick-btn:hover,
.quick-btn:active{

    background:
        rgba(0,130,220,.35);

    color:white;

    box-shadow:
        0 0 20px rgba(0,160,255,.3);

    transform:
        translateY(-3px);
}

/* ================= EXTRA ACTIONS ================= */

.extra-actions{
    margin-top:10px;

    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:9px;
}

.extra-btn{
    min-height:52px;

    border:
        1px solid rgba(0,170,255,.28);

    background:
        rgba(2,15,28,.58);

    border-radius:15px;

    color:#82b9d3;

    cursor:pointer;

    display:flex;

    align-items:center;
    justify-content:center;

    gap:8px;

    font-size:11px;

    transition:.25s;
}

.extra-btn i{
    color:#00c8ff;
}

.extra-btn:hover{

    color:white;

    border-color:#00c8ff;

    box-shadow:
        0 0 18px rgba(0,180,255,.3);

    transform:
        translateY(-2px);
}

/* ================= NFC ================= */

.nfc{
    margin-top:20px;

    padding:14px;

    border-radius:18px;

    border:
        1px solid rgba(0,180,255,.25);

    background:
        rgba(2,15,27,.5);

    display:flex;

    align-items:center;
    justify-content:center;

    gap:10px;

    color:#6898af;

    font-size:10px;
}

.nfc i{
    color:#00c8ff;

    animation:
        nfcPulse
        1.5s
        infinite;
}

@keyframes nfcPulse{

    50%{
        transform:scale(1.3);

        filter:
            drop-shadow(
                0 0 10px
                #00c8ff
            );
    }
}

/* ================= FOLLOW ================= */

.follow{
    margin-top:35px;
}

.follow-title{
    color:#a8c0cf;

    letter-spacing:2px;

    margin-bottom:17px;

    font-size:14px;
}

.socials{
    display:flex;

    justify-content:center;

    gap:16px;
}

.social{
    width:52px;
    height:52px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    color:white;

    text-decoration:none;

    border:
        1px solid #008cff;

    background:
        rgba(3,18,32,.65);

    backdrop-filter:blur(10px);

    box-shadow:
        0 0 15px rgba(0,140,255,.25);

    transition:.3s;
}

.social:hover{

    transform:
        translateY(-6px)
        scale(1.12);

    background:#008cff;

    box-shadow:
        0 0 25px #008cff;
}

/* ================= FOOTER ================= */

.footer{
    margin-top:25px;

    color:#385266;

    font-size:9px;

    letter-spacing:2px;
}

/* ================= MODAL ================= */

.modal{
    position:fixed;

    inset:0;

    z-index:100;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        rgba(0,3,8,.82);

    backdrop-filter:blur(15px);
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;

    max-width:390px;

    max-height:90vh;

    overflow:auto;

    border:
        1px solid rgba(0,190,255,.6);

    border-radius:25px;

    padding:25px;

    background:
        linear-gradient(
            145deg,
            rgba(0,50,90,.8),
            rgba(2,8,18,.95)
        );

    box-shadow:
        0 0 30px rgba(0,170,255,.35),
        0 0 100px rgba(0,100,255,.15);

    animation:
        modalIn
        .35s
        ease;

    position:relative;
}

@keyframes modalIn{

    from{
        opacity:0;

        transform:
            scale(.85)
            translateY(20px);
    }

    to{
        opacity:1;

        transform:
            scale(1)
            translateY(0);
    }
}

.close{
    position:absolute;

    top:12px;
    left:15px;

    width:35px;
    height:35px;

    border-radius:50%;

    border:
        1px solid #008cff;

    background:#061522;

    color:white;

    cursor:pointer;
}

.modal-title{
    color:#00c8ff;

    font-size:22px;

    margin-bottom:20px;

    text-shadow:
        0 0 15px #008cff;
}

.modal-section{
    margin-bottom:18px;

    padding:15px;

    border-radius:15px;

    background:
        rgba(0,100,180,.08);

    border:
        1px solid rgba(0,160,255,.18);
}

.modal-section strong{
    display:block;

    color:#7edfff;

    margin-bottom:8px;
}

.modal-section p{
    color:#9eb6c5;

    font-size:13px;

    line-height:1.8;
}

/* ================= QR ================= */

#qrcode{
    width:220px;
    height:220px;

    margin:15px auto;

    padding:10px;

    background:white;

    border-radius:15px;

    display:flex;

    align-items:center;
    justify-content:center;
}

#qrcode img{
    max-width:100%;
}

/* ================= TOAST ================= */

.toast{
    position:fixed;

    bottom:80px;
    left:50%;

    transform:
        translateX(-50%)
        translateY(20px);

    z-index:200;

    padding:12px 20px;

    border-radius:14px;

    background:
        rgba(2,20,35,.95);

    border:
        1px solid #00bfff;

    color:white;

    font-size:12px;

    box-shadow:
        0 0 25px rgba(0,170,255,.4);

    backdrop-filter:blur(15px);

    opacity:0;

    transition:.3s;
}

.toast.show{
    opacity:1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* ================= MOBILE ================= */

@media(max-width:500px){

    .profile-zone{
        width:145px;
        height:145px;
    }

    .profile{
        width:130px;
        height:130px;
    }

    h1{
        font-size:29px;
    }

    .btn{
        min-height:72px;

        border-radius:19px;
    }

    .icon{
        width:45px;
        height:45px;

        margin-left:11px;
    }

    .text strong{
        font-size:16px;
    }

    .text small{
        font-size:10px;
    }
}

</style>
</head>

<script>

/* ================= STARS ================= */

const stars =
document.getElementById("stars");

for(let i=0;i<40;i++){

    const star =
        document.createElement("div");

    star.className="star";

    star.style.left =
        Math.random()*100+"%";

    star.style.animationDuration =
        (7+Math.random()*12)+"s";

    star.style.animationDelay =
        (-Math.random()*15)+"s";

    star.style.opacity =
        Math.random();

    stars.appendChild(star);
}


/* ================= 3D CARD ================= */

const card =
document.getElementById("card");

document.addEventListener(
    "mousemove",
    e=>{

        if(window.innerWidth<700)
            return;

        const x =
            (window.innerWidth/2-e.clientX)/100;

        const y =
            (window.innerHeight/2-e.clientY)/100;

        card.style.transform =
            `rotateY(${x}deg) rotateX(${y}deg)`;

    }
);


/* ================= MAGNETIC BUTTONS ================= */

document
.querySelectorAll(".btn")
.forEach(btn=>{

    btn.addEventListener(
        "mousemove",
        e=>{

            if(window.innerWidth<700)
                return;

            const rect =
                btn.getBoundingClientRect();

            const x =
                e.clientX -
                rect.left -
                rect.width/2;

            const y =
                e.clientY -
                rect.top -
                rect.height/2;

            btn.style.transform =
                `translate(
                    ${x*.025}px,
                    ${y*.025}px
                )`;

        }
    );


    btn.addEventListener(
        "mouseleave",
        ()=>{

            btn.style.transform="";

        }
    );

});


/* ================= RIPPLE ================= */

document
.querySelectorAll(
    ".btn,.quick-btn,.extra-btn,.social"
)
.forEach(element=>{

    element.addEventListener(
        "click",
        function(e){

            if(
                getComputedStyle(this)
                .position==="static"
            ){

                this.style.position="relative";

            }


            const rect =
                this.getBoundingClientRect();

            const ripple =
                document.createElement("span");

            const size =
                Math.max(
                    rect.width,
                    rect.height
                );

            ripple.style.position="absolute";

            ripple.style.width =
                size+"px";

            ripple.style.height =
                size+"px";

            ripple.style.borderRadius="50%";

            ripple.style.background =
                "rgba(255,255,255,.18)";

            ripple.style.left =
                (
                    e.clientX -
                    rect.left -
                    size/2
                )+"px";

            ripple.style.top =
                (
                    e.clientY -
                    rect.top -
                    size/2
                )+"px";

            ripple.style.pointerEvents="none";

            ripple.style.transform="scale(0)";

            ripple.style.transition =
                "transform .6s,opacity .6s";

            this.appendChild(ripple);


            requestAnimationFrame(()=>{

                ripple.style.transform =
                    "scale(2)";

                ripple.style.opacity="0";

            });


            setTimeout(
                ()=>ripple.remove(),
                700
            );

        }
    );

});

        .writeText(text)

            );

    }else{

        showToast(text);

    }

}

/* ================= TOAST ================= */

function showToast(message){

    const toast =
        document.getElementById("toast");

    toast.innerText=message;

    toast.classList.add("show");

    clearTimeout(
        window.toastTimer
    );

    window.toastTimer =
        setTimeout(
            ()=>{

                toast.classList
                    .remove("show");

            },
            2200
        );

}
